spring.application.name=apexstreet-backend
server.port=8081

# Production database configuration. Credentials must be supplied by the host environment.
spring.datasource.url=jdbc:mysql://localhost:3306/apexstreet_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Settings
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250655368566D5970}
app.jwt.expiration-ms=86400000

# Safe Admin Account Auto-Initialization for Development
app.admin.init.enabled=${ADMIN_INIT_ENABLED:false}
app.admin.init.name=${ADMIN_INIT_NAME:ApexStreet Admin}
app.admin.init.email=${ADMIN_INIT_EMAIL:admin@apexstreet.com}
app.admin.init.password=${ADMIN_INIT_PASSWORD:Admin@12345}
